<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Activity">
<meta name="theme-color" content="#0b5cab">
<title>Daily Activity</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#f2f4f7;color:#111;padding:env(safe-area-inset-top) 12px 40px}
h1{font-size:22px;margin:16px 4px}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.lbl{flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px;padding-right:8px}.step{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.step button{width:52px;height:52px;border-radius:12px;border:0;font-size:28px;background:#e6eefa;color:#0b5cab}
.step input{width:60px;height:52px;text-align:center;font-size:22px;border:1px solid #ccd;border-radius:10px}
label.f{display:block;font-size:14px;color:#555;margin:6px 0 4px}select,input[type=date]{width:100%;height:48px;font-size:17px;border:1px solid #ccd;border-radius:10px;padding:0 10px;background:#fff}
.hrs{display:flex;gap:8px}.hrs>div{flex:1}pre{white-space:pre-wrap;font:15px/1.4 ui-monospace,monospace;margin:0}
.btns{display:grid;gap:10px}.btns button{height:56px;border:0;border-radius:14px;font-size:18px;font-weight:600}
#wa{background:#25d366;color:#fff}#cp{background:#0b5cab;color:#fff}#rs{background:#e4e4e7}
</style></head><body>
<h1>Daily Activity</h1>
<div class="card"><label class="f">Date</label><input type="date" id="date">
<label class="f">Hours knocked (optional)</label><div class="hrs"><div><select id="hs"></select></div><div><select id="he"></select></div></div></div>
<div class="card" id="fields"></div>
<div class="card"><pre id="pv"></pre></div>
<div class="btns"><button id="wa">Post to All Branches Daily Tracking Upload</button><button id="cp">Copy text</button><button id="rs">Reset</button></div>
<script>
var F=["Doors knocked","Contacts made","Appointments scheduled","No-show appointments","Appointments/demos completed","Consulting agreements signed","Adjuster meetings scheduled","Adjuster meetings denied","Adjuster meetings won","Contracts signed","Reviews posted"];
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var KEY="da-"+today(),st=JSON.parse(localStorage.getItem(KEY)||"null")||{date:today(),hs:"",he:"",v:F.map(function(){return 0})};
function fmt(m,ap){var h=Math.floor(m/60),mi=m%60,h12=h%12||12;return h12+(mi?":"+String(mi).padStart(2,"0"):"")+(ap?" "+(h<12?"AM":"PM"):"")}
["hs","he"].forEach(function(id){var s=document.getElementById(id);s.add(new Option(id=="hs"?"Start —":"End —",""));for(var m=360;m<=1320;m+=15)s.add(new Option(fmt(m,1),m));});
var fd=document.getElementById("fields");
F.forEach(function(n,i){var r=document.createElement("div");r.className="row";r.innerHTML='<div class="lbl">'+n+'</div><div class="step"><button data-d="-1">−</button><input type="number" inputmode="numeric" min="0"><button data-d="1">+</button></div>';
var inp=r.querySelector("input");inp.id="f"+i;inp.onfocus=function(){inp.select()};inp.oninput=function(){st.v[i]=Math.max(0,parseInt(inp.value)||0);upd(1)};
r.querySelectorAll("button").forEach(function(b){b.onclick=function(){st.v[i]=Math.max(0,st.v[i]+ +b.dataset.d);upd()}});fd.appendChild(r)});
function text(){var p=st.date.split("-"),d=new Date(+p[0],p[1]-1,+p[2]);var t="*Daily Activity – "+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate()+"*\n";
if(st.hs&&st.he){var a=+st.hs,b=+st.he,same=(a<720)==(b<720);t+="Hours: "+(same?fmt(a):fmt(a,1))+"–"+fmt(b,1)+"\n"}
return t+F.map(function(n,i){return n+": "+st.v[i]}).join("\n")}
function upd(typing){F.forEach(function(n,i){if(!typing)document.getElementById("f"+i).value=st.v[i]});document.getElementById("date").value=st.date;
document.getElementById("hs").value=st.hs;document.getElementById("he").value=st.he;document.getElementById("pv").textContent=text();localStorage.setItem(KEY,JSON.stringify(st))}
document.getElementById("date").onchange=function(e){st.date=e.target.value||today();upd()};
document.getElementById("hs").onchange=function(e){st.hs=e.target.value;upd()};document.getElementById("he").onchange=function(e){st.he=e.target.value;upd()};
document.getElementById("wa").onclick=function(){location.href="https://wa.me/?text="+encodeURIComponent(text())};
document.getElementById("cp").onclick=function(){var b=this,t=text(),ok=function(){b.textContent="Copied!";setTimeout(function(){b.textContent="Copy text"},1500)};
if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,fb);else fb();function fb(){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();ok()}};
document.getElementById("rs").onclick=function(){if(confirm("Reset all values?")){st={date:today(),hs:"",he:"",v:F.map(function(){return 0})};upd()}};
upd();
</script></body></html>
